<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <style>
    :root { --bg: #ffffff; --fg: #1f2933; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --fg: #e2e8f0; --accent: #60a5fa; }
    }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 4rem 1rem; }
    h1 { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <p>This is a simple static website. Replace this text with your own content.</p>
  </main>
</body>
</html>
